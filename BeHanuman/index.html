:root{--bg:#e3e3e1;--ink:#111;--rule:#8d8d8b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#d3d3d1;color:var(--ink);font-family:Inter,Khand,system-ui,sans-serif;
  height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0}

/* the stack of full-screen cards */
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:0;background:var(--bg);will-change:transform;
  transition:transform .55s cubic-bezier(.22,.8,.24,1),border-radius .55s,opacity .3s;
  overflow:hidden;transform-origin:50% 100%}
#stage.moving .card{box-shadow:0 0 60px rgba(0,0,0,.2)}
#stage.drag .card{transition:none}

.card{container-type:size}
.wrap{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;
  padding:calc(max(12px,env(safe-area-inset-top)) + 78px) clamp(18px,5vw,40px) 84px;gap:clamp(10px,2cqh,18px);--ah:clamp(140px,calc(27cqh + (100cqh - 560px) * .55),360px)}
.art{flex:none;height:var(--ah);aspect-ratio:1/1;max-width:80%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:contain;display:block}

.verse{flex:none;width:100%;font-family:Khand,Inter,sans-serif;font-weight:500;color:#111;line-height:1.2;--vs:clamp(26px,7vw,36px)}
.verse span{display:block;white-space:normal;text-wrap:balance;font-size:var(--vs)}
.bar{font-style:normal;font-weight:400;opacity:.8;letter-spacing:-.06em;margin:0 .1em}
.v-hi{display:none}
body.hi .v-hing{display:none}
body.hi .v-hi{display:block}
.mean{flex:none;margin-top:clamp(2px,1cqh,10px);width:min(calc(100% - 52px),500px);font-family:Kalam,'Comic Sans MS',cursive;font-weight:400;line-height:1.4}
.mean p,.mt,.ex{margin:0;font-family:Kalam,'Comic Sans MS',cursive;font-weight:400;line-height:1.4}
.mt{color:#e06b0a;font-size:calc(var(--ms,1) * clamp(12px,3.6vw,16px))}
.ex{color:#111;font-size:calc(var(--ms,1) * clamp(14.5px,4.1vw,17px));margin-top:clamp(6px,1.4cqh,12px);line-height:1.38}

/* controls */
#ui{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 clamp(16px,5vw,40px) max(16px,env(safe-area-inset-bottom));pointer-events:none}
#ui button{pointer-events:auto;background:#111;color:#fff;font-size:14px;letter-spacing:.06em;
  padding:11px 18px;border-radius:999px}
#ui button:active{transform:scale(.96)}
#foot{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;height:44px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;white-space:nowrap;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#333;line-height:1.55}
#foot b{font-weight:500;color:#111}
#hint{font-style:normal;margin-left:.3em;display:inline-block;animation:bob 1.6s ease-in-out infinite;transition:opacity .4s}
#hint.gone{display:none}
@keyframes bob{50%{transform:translateY(-3px)}}

/* progress: a floating gada climbs the right edge, bottom (card 1) to top (card 42). No trail. */
#prog{position:fixed;right:6px;top:max(13vh,92px);bottom:max(14vh,96px);width:34px;z-index:46;pointer-events:none;--p:0}
#prog .mark{position:absolute;left:50%;bottom:calc(var(--p) * 100%);transform:translate(-50%,50%);transition:bottom .7s cubic-bezier(.22,.8,.24,1)}
#prog .mark img{display:block;height:70px;width:auto;animation:float 3.2s ease-in-out infinite;
  filter:drop-shadow(0 0 5px rgba(232,113,10,.55)) drop-shadow(0 4px 6px rgba(232,113,10,.25))}
@keyframes float{0%,100%{transform:translateY(-3px) rotate(-2deg)}50%{transform:translateY(4px) rotate(2deg)}}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#111;padding:10px 12px max(12px,env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .4s cubic-bezier(.22,.8,.24,1);color:#ddd}
#sheet.open{transform:none}
#sheet .in{max-width:600px;margin:0 auto}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:8px;color:#bbb}
#sheet .hd button{background:#333;color:#fff;border-radius:999px;padding:5px 14px;font-size:12px}
#sheet iframe{display:block;width:100%;height:80px;border:0;border-radius:12px}


/* header: language switch left, title centre, music right */
#top{position:fixed;top:0;left:0;right:0;z-index:44;pointer-events:none;font-family:Khand,Inter,sans-serif;font-weight:500;color:#111;line-height:1.15;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;column-gap:8px;
  padding:max(12px,env(safe-area-inset-top)) clamp(14px,4vw,28px) 0}
#top .ttl{text-align:center}
#top b{display:block;font-weight:500;font-size:clamp(22px,3.4vh,30px);letter-spacing:.04em}
#top span{display:block;font-size:clamp(14px,2.1vh,18px);color:#444;letter-spacing:.03em;margin-top:2px}
#top .pill{pointer-events:auto;margin-top:2px;background:#111;color:#f08a2c;font-family:Inter,Khand,sans-serif;font-size:14px;font-weight:500;letter-spacing:.04em;
  padding:9px 16px;border-radius:999px;min-width:76px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#top #lang{justify-self:start}
#top #music{justify-self:end}
#top .pill:active{transform:scale(.96)}

/* short phones (iPhone SE / mini): tighter text so the image stays visible */
@media (max-height:700px){
  .wrap{gap:8px;padding-bottom:70px}
  .mean .mt{line-height:1.3}
  .mean .ex{line-height:1.3;margin-top:5px}
}

/* sankalp screen */
.sk{flex:none;width:min(calc(100% - 20px),500px);text-align:center}
.sk h2{margin:0 0 4px;font-family:Khand,Inter,sans-serif;font-weight:500;font-size:clamp(30px,8.4vw,40px);color:#111;line-height:1.1;letter-spacing:.03em}
.goals{display:flex;justify-content:center;gap:clamp(10px,3vw,16px);margin:clamp(12px,2.4cqh,22px) 0}
.goals button{width:clamp(54px,15vw,66px);height:clamp(54px,15vw,66px);border-radius:50%;background:#111;color:#f08a2c;font-family:Khand,Inter,sans-serif;font-weight:500;font-size:clamp(24px,7vw,30px);line-height:1;transition:transform .15s,background .15s}
.goals button:active{transform:scale(.94)}
.goals button.on{background:#e06b0a;color:#fff}
.lnk{margin-top:8px;padding:8px 14px;font-family:Inter,sans-serif;font-size:14px;font-weight:500;letter-spacing:.03em;color:#111;text-decoration:underline;text-underline-offset:3px}

/* jaikara screen (no image) */
.jk{gap:clamp(10px,2.2cqh,20px)}
.jv{width:min(calc(100% - 20px),500px);text-align:center}
.jv .v-hing,.jv .v-hi{font-family:Khand,Inter,sans-serif;font-weight:500;color:#111;line-height:1.2;font-size:clamp(24px,7.6vw,36px)}
.jv .mt{font-size:clamp(15px,4.2vw,18px);margin-top:2px}
.jv.rn{margin-top:clamp(2px,1cqh,10px)}
.jv.rn .ex{font-size:clamp(14px,3.8vw,16px);margin-bottom:2px}
.jv.rn .v-hing,.jv.rn .v-hi{font-size:clamp(21px,6.4vw,28px)}
.rounds{width:min(calc(100% - 20px),500px);text-align:center;margin-top:clamp(4px,1.4cqh,14px)}
#rtxt b{display:block;font-family:Kalam,cursive;font-weight:400;color:#e06b0a;font-size:clamp(19px,5.4vw,23px);line-height:1.3}
#rtxt span{display:block;font-family:Kalam,cursive;color:#111;font-size:clamp(15px,4.2vw,18px)}
#again{margin-top:12px;padding:12px 24px;border-radius:999px;background:#111;color:#f08a2c;font-family:Inter,sans-serif;font-size:15px;font-weight:500;letter-spacing:.04em}
#again:active{transform:scale(.96)}

/* add to home screen help */
#a2hs{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#111;color:#eee;padding:18px 18px max(18px,env(safe-area-inset-bottom));border-radius:18px 18px 0 0;
  transform:translateY(105%);transition:transform .4s cubic-bezier(.22,.8,.24,1);font-family:Inter,sans-serif}
#a2hs.open{transform:none}
#a2hs .in{max-width:520px;margin:0 auto}
#a2hs b{display:block;font-weight:500;font-size:16px;color:#f08a2c;margin-bottom:8px}
#a2hs p{margin:0 0 14px;font-size:15px;line-height:1.55}
#a2hs i{font-style:normal;color:#fff;font-weight:500}
#a2hs button{background:#f08a2c;color:#111;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:500}
.jv.rn .rep{margin-top:6px;font-family:Khand,Inter,sans-serif;font-weight:500;font-size:clamp(16px,4.6vw,20px);color:#444;letter-spacing:.04em}

.wrap.jk{justify-content:center}
/* sankalp: music choice */
.mus{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 clamp(8px,1.6cqh,14px);font-family:Inter,sans-serif;font-size:14px;color:#111}
.mus span{letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:#333;margin-right:2px}
.mus button{padding:8px 18px;border-radius:999px;background:#111;color:#f08a2c;font-family:Inter,sans-serif;font-size:14px;font-weight:500;letter-spacing:.04em}
.mus button.on{background:#e06b0a;color:#fff}
@media (max-height:700px){.sk .ex{display:none}}

/* explanation bubble */
.more{margin-top:10px;padding:8px 18px;border-radius:999px;border:1.5px solid #111;background:transparent;color:#111;font-family:Inter,sans-serif;font-size:13px;font-weight:500;letter-spacing:.05em}
.more:active{transform:scale(.96)}
#bubble{position:fixed;left:16px;right:16px;max-width:520px;margin:0 auto;z-index:70;background:#fff;color:#111;padding:16px 18px;border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.22);font-family:Kalam,'Comic Sans MS',cursive;font-size:clamp(16px,4.4vw,19px);line-height:1.45;text-align:center;
  max-height:calc(100dvh - 150px);overflow:auto;opacity:0;pointer-events:none;transform:scale(.88) translateY(10px);transform-origin:var(--tx,50%) 100%;
  transition:opacity .2s,transform .28s cubic-bezier(.2,.9,.3,1.2)}
#bubble.open{opacity:1;pointer-events:auto;transform:none}
#bubble p{margin:0}
#bubble .tail{position:absolute;bottom:-7px;left:var(--tx,50%);width:16px;height:16px;margin-left:-8px;background:#fff;transform:rotate(45deg);border-radius:0 0 4px 0;box-shadow:4px 4px 10px rgba(0,0,0,.08)}
/* jaikara with image */
.jk{--ah:clamp(110px,23cqh,240px)}
@media (max-height:700px){
  .jk{gap:6px;--ah:clamp(110px,19cqh,210px)}
  .jv .v-hing,.jv .v-hi{font-size:clamp(20px,6.2vw,26px)}
  .jv .mt{font-size:14px}
  .jv.rn .v-hing,.jv.rn .v-hi{font-size:clamp(18px,5.4vw,22px)}
  #rtxt b{font-size:18px}#rtxt span{font-size:14px}
  #again{margin-top:6px;padding:9px 20px}
}

/* phone audit fixes (v0.23): bigger tap targets, narrow-phone footer, tiny-phone header and Jaikara */
#top .pill{min-height:42px;padding:11px 16px}
#ui button{min-height:44px}
.more{min-height:40px}
@media (max-width:400px){
  #ui button{padding:11px 15px;font-size:13px}
  #foot{left:calc(50% - 10px)}
  #top .pill{min-width:70px;padding:11px 14px}
}
@media (max-width:340px){
  #top .pill{min-width:0;padding:10px 11px;font-size:13px}
  #top b{font-size:20px}
  #top span{font-size:13px}
  #hint{display:none}
  #foot{left:calc(50% - 26px)}
  #ui button{padding:11px 12px}
}
@media (max-height:600px){.jk .art{display:none}}
/* v0.24: Safari-visible-height aware sankalp */
.skw{--ah:clamp(110px,30cqh,300px)}
@container (max-height:720px){.skw{--ah:clamp(90px,24cqh,200px);gap:6px}.sk .ex{display:none}.goals{margin:10px 0}}

/* v0.25: explanation button in footer, swipe cue */
#explain{visibility:hidden}
.skw{padding-bottom:138px}
.swipe{position:absolute;left:0;right:0;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 52px);display:flex;flex-direction:column;align-items:center;pointer-events:none;color:#111;font-family:Inter,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.swipe i{display:block;width:14px;height:14px;border-left:3px solid #e06b0a;border-top:3px solid #e06b0a;transform:rotate(45deg);margin-bottom:-6px;opacity:0;animation:swp 1.6s ease-in-out infinite}
.swipe i:nth-child(2){animation-delay:.25s}
.swipe span{margin-top:12px;opacity:.75}
@keyframes swp{0%{opacity:0;transform:translateY(14px) rotate(45deg)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px) rotate(45deg)}}
@container (max-height:640px){.swipe{display:none}.skw{padding-bottom:84px}}
@media (prefers-reduced-motion:reduce){.swipe i{animation:none;opacity:.8}}
#hint{display:none!important}
/* v0.26: chaupai meaning +1.25pt, smaller explanation button */
.chp .mt{font-size:calc(var(--ms,1) * clamp(13.7px,calc(3.6vw + 1.67px),17.7px))}
#ui #explain{min-height:36px;padding:8px 14px;font-size:12px;letter-spacing:.05em}

</style>
</head>

{k:"चौपाई",kl:"Chaupai",n:25,

{k:"चौपाई",kl:"Chaupai",n:26,

 hing:["Sankat te Hanumaan chhudaavai","Man kram bachan dhyaan jo laavai"],
 hi:"जो मन, कर्म और वचन से हनुमान जी का ध्यान करता है, उसे वे हर संकट से छुड़ा लेते हैं।",
 en:"Hanuman frees from trouble anyone who remembers him with mind, action and word.",
 mt:"Hanuman delivers from trouble those who remember him through thought, action, and speech.",
 ex:"The verse asks for devotion involving the whole person. What someone thinks, says, and does should support the same sincere commitment."},
{k:"चौपाई",kl:"Chaupai",n:27,
 dev:["सब पर राम तपस्वी राजा।","तिन के काज सकल तुम साजा॥"],
 hing:["Sab par Raam tapasvee raajaa","Tin ke kaaj sakal tum saajaa"],
 hi:"तपस्वी राजा श्रीराम सबसे ऊपर हैं, और उनके सारे कार्य आपने ही सिद्ध किए।",
 en:"Ram, the ascetic king, stands above all, and it was you who carried out all his work.",
 mt:"Rama, the king devoted to spiritual discipline, reigns supreme; you accomplish all his tasks.",
 ex:"“Tapasvi” describes someone who practises discipline and restraint. Hanuman’s service supports Rama’s righteous purpose."},
{k:"चौपाई",kl:"Chaupai",n:28,
 dev:["और मनोरथ जो कोई लावै।","सोई अमित जीवन फल पावै॥"],
 hing:["Aur manorath jo koee laavai","Soee amit jeevan phal paavai"],
 hi:"जो कोई भी सच्चे मन से कोई इच्छा लेकर आपके पास आता है, उसे जीवन में अपार फल मिलता है।",
 en:"Whoever comes to you with a heartfelt wish receives the fullest fruit in life.",
 mt:"Whoever brings their heartfelt wishes to you receives abundant fulfilment in life.",
 ex:"“Manorath” means a cherished wish or aspiration. This is the devotee’s expression of trust in Hanuman’s generosity and blessing."},
{k:"चौपाई",kl:"Chaupai",n:29,
 dev:["चारों जुग परताप तुम्हारा।","है परसिद्ध जगत उजियारा॥"],
 hing:["Chaaron jug parataap tumhaaraa","Hai parasiddh jagat ujiyaaraa"],
 hi:"चारों युगों में आपका प्रताप फैला है; आपकी कीर्ति पूरे जगत में प्रकाश की तरह प्रसिद्ध है।",
 en:"Your glory spans all four ages, and your fame lights up the world.",
 mt:"Your greatness extends through all four ages, and your renowned glory lights up the world.",
 ex:"The four ages are the traditional Hindu ages of Satya, Treta, Dvapara, and Kali. Hanuman’s significance is presented as enduring across time."},
{k:"चौपाई",kl:"Chaupai",n:30,
 dev:["साधु संत के तुम रखवारे।","असुर निकंदन राम दुलारे॥"],
 hing:["Saadhu sant ke tum rakhvaare","Asur nikandan Raam dulaare"],
 hi:"आप साधु-संतों की रक्षा करते हैं, राक्षसों का नाश करते हैं और श्रीराम के प्यारे हैं।",
 en:"You protect saints and sages, destroy the demons, and are dear to Ram.",
 mt:"You protect holy people, destroy demons, and are dearly loved by Rama.",
 ex:"This brings together three aspects of Hanuman: protection, courage against wrongdoing, and devotion. His strength serves those who need his care."},
{k:"चौपाई",kl:"Chaupai",n:31,
 dev:["अष्ट सिद्धि नौ निधि के दाता।","अस बर दीन जानकी माता॥"],
 hing:["Asht siddhi nau nidhi ke daataa","As bar deen Jaanakee maataa"],
 hi:"माता जानकी के वरदान से आप आठ सिद्धियों और नौ निधियों के दाता हैं।",
 en:"By Mother Janaki's boon, you can grant the eight powers and the nine treasures.",
 mt:"You can bestow the eight spiritual powers and the nine treasures, through a blessing given by Mother Sita.",
 ex:"“Janaki” is another name for Sita. The eight powers are extraordinary abilities described in spiritual traditions; the nine treasures represent forms of wealth and abundance. The verse honours Sita’s blessing and Hanuman’s ability to share it."},
{k:"चौपाई",kl:"Chaupai",n:32,
 dev:["राम रसायन तुम्हरे पासा।","सदा रहो रघुपति के दासा॥"],
 hing:["Raam rasaayan tumhare paasaa","Sadaa raho Raghupati ke daasaa"],
 hi:"आपके पास राम नाम का रसायन है, और आप सदा रघुपति के दास बने रहते हैं।",
 en:"You hold the elixir of Ram's name and remain forever Ram's devoted servant.",
 mt:"You possess the life-giving essence of devotion to Rama and remain forever his servant.",
 ex:"“Rasayan” means an elixir or rejuvenating substance. Here, love and remembrance of Rama are pictured as nourishment for the soul. Despite his powers, Hanuman remains devoted to service."},
{k:"चौपाई",kl:"Chaupai",n:33,
 dev:["तुम्हरे भजन राम को पावै।","जनम जनम के दुख बिसरावै॥"],
 hing:["Tumhare bhajan Raam ko paavai","Janam janam ke dukh bisraavai"],
 hi:"आपका भजन करने से श्रीराम की प्राप्ति होती है और जन्म-जन्म के दुख भूल जाते हैं।",
 en:"By worshipping you one reaches Ram, and the sorrows of many lifetimes are forgotten.",
 mt:"Through devotion to you, a person reaches Rama and is freed from the sorrows of countless lifetimes.",
 ex:"Hanuman leads the devotee towards the Lord he himself loves. “Countless lifetimes” places this promise within the Hindu understanding of rebirth and spiritual liberation."},
{k:"चौपाई",kl:"Chaupai",n:34,
 dev:["अंत काल रघुबर पुर जाई।","जहाँ जन्म हरि-भक्त कहाई॥"],
 hing:["Ant kaal Raghubar pur jaaee","Jahaan janm Hari-bhakt kahaaee"],
 hi:"अंत समय में भक्त श्रीराम के धाम जाता है, और यदि जन्म ले तो हरि-भक्त कहलाता है।",
 en:"At life's end the devotee reaches Ram's abode, and if reborn, is known as a devotee of Hari.",
 mt:"At life’s end, the devotee reaches Rama’s abode; wherever born, they are known as a devotee of God.",
 ex:"The verse expresses hope that devotion carries beyond death. Translations differ slightly in how they connect its two lines, but the central idea is an enduring relationship with God."},
{k:"चौपाई",kl:"Chaupai",n:35,
 dev:["और देवता चित्त न धरई।","हनुमत सेई सर्ब सुख करई॥"],
 hing:["Aur devtaa chitt na dharaee","Hanumat seee sarb sukh karaee"],
 hi:"फिर किसी और देवता को मन में रखने की आवश्यकता नहीं; हनुमान जी की सेवा से ही सब सुख मिल जाते हैं।",
 en:"No other deity need occupy the mind; serving Hanuman alone brings every happiness.",
 mt:"Even without turning the mind towards other deities, one who serves Hanuman receives every happiness.",
 ex:"This expresses confidence in wholehearted devotion to Hanuman. It is commonly understood as praising the completeness of that path, rather than requiring contempt for other forms of worship."},
{k:"चौपाई",kl:"Chaupai",n:36,
 dev:["संकट कटै मिटै सब पीरा।","जो सुमिरै हनुमत बलबीरा॥"],
 hing:["Sankat katai mitai sab peeraa","Jo sumirai Hanumat balbeeraa"],
 hi:"जो बलवीर हनुमान जी का स्मरण करता है, उसके संकट कट जाते हैं और सब पीड़ा मिट जाती है।",
 en:"Troubles are cut away and all pain ends for those who remember mighty Hanuman.",
 mt:"Troubles are overcome and suffering is removed for those who remember mighty Hanuman.",
 ex:"The promise returns to the hymn’s recurring theme of protection. Remembrance means keeping him present in the heart, especially in times of distress."},
{k:"चौपाई",kl:"Chaupai",n:37,
 dev:["जै जै जै हनुमान गोसाईं।","कृपा करहु गुरु देव की नाईं॥"],
 hing:["Jai jai jai Hanumaan Gosaaeen","Kripaa karahu guru dev kee naaeen"],
 hi:"हे स्वामी हनुमान जी, आपकी जय हो, जय हो, जय हो! गुरुदेव की तरह मुझ पर कृपा कीजिए।",
 en:"Victory, victory, victory to Lord Hanuman! Bless me with your grace, as a Guru would.",
 mt:"Glory, glory, glory to Lord Hanuman. Show me compassion as a revered teacher would.",
 ex:"The prayer now addresses Hanuman personally. It asks him to guide, support, and correct the devotee with a teacher’s care."},
{k:"चौपाई",kl:"Chaupai",n:38,
 dev:["जो सत बार पाठ कर कोई।","छूटहि बंदि महा सुख होई॥"],
 hing:["Jo sat baar paath kar koee","Chhootahi bandi mahaa sukh hoee"],
 hi:"जो इसका सौ बार पाठ करता है, वह बंधनों से छूट जाता है और उसे परम सुख मिलता है।",
 en:"Whoever recites this a hundred times is freed from bondage and finds great joy.",
 mt:"Whoever recites this prayer a hundred times is released from bondage and receives great happiness.",
 ex:"The common reading of “sat bar” here is “a hundred times.” Bondage can mean captivity and, in a spiritual reading, the attachments or fears that keep a person inwardly trapped. The verse expresses faith in sustained recitation."},
{k:"चौपाई",kl:"Chaupai",n:39,
 dev:["जो यह पढ़ै हनुमान चालीसा।","होय सिद्धि साखी गौरीसा॥"],
 hing:["Jo yah padhai Hanumaan Chaaleesaa","Hoy siddhi saakhee Gaureesaa"],
 hi:"जो हनुमान चालीसा पढ़ता है, उसे सिद्धि मिलती है; भगवान शिव इसके साक्षी हैं।",
 en:"Whoever reads the Hanuman Chalisa attains success; Lord Shiva himself is the witness.",
 mt:"Whoever reads the Hanuman Chalisa attains fulfilment, with Shiva as witness.",
 ex:"“Gaurisa” means the Lord of Gauri—Shiva. “Siddhi” here means accomplishment or fulfilment, which can include spiritual attainment."},
{k:"चौपाई",kl:"Chaupai",n:40,
 dev:["तुलसीदास सदा हरि चेरा।","कीजै नाथ हृदय महँ डेरा॥"],
 hing:["Tulseedaas sadaa Hari cheraa","Keejai Naath hriday mahan deraa"],
 hi:"तुलसीदास सदा श्रीहरि के सेवक हैं। हे नाथ, आप मेरे हृदय में निवास कीजिए।",
 en:"Tulsidas is forever Hari's servant. O Lord, please make my heart your home.",
 mt:"Tulsidas is forever God’s servant. O Lord, make your dwelling in my heart.",
 ex:"The hymn ends with a personal request for Hanuman’s presence. After praising his greatness, Tulsidas asks that his own inner life be filled with devotion."},
{k:"दोहा",kl:"Closing Doha",n:0,
 dev:["पवनतनय संकट हरन, मंगल मूरति रूप।","राम लखन सीता सहित, हृदय बसहु सुर भूप॥"],
 hing:["Pavantanay sankat haran, mangal moorat roop","Raam Lakhan Seetaa sahit, hriday basahu sur bhoop"],
 hi:"हे पवनपुत्र, संकटों को हरने वाले, मंगलमूर्ति देवराज! आप श्रीराम, लक्ष्मण और सीता जी सहित मेरे हृदय में निवास कीजिए।",
 en:"Son of the Wind, remover of troubles, embodiment of all that is auspicious, king of the gods: live in my heart together with Ram, Lakshman and Sita.",
 mt:"O son of the Wind God, remover of troubles and embodiment of blessing, dwell in my heart together with Rama, Lakshmana, and Sita.",
 ex:"The final prayer gathers the whole hymn into one wish: that Hanuman and those he loves remain present within the devotee. It asks for an inward life shaped by courage, compassion, loyalty, and faith."}
];

window.CHALISA_OP2 = {k:"दोहा",kl:"Opening Doha 2",n:0,
 dev:["बुद्धिहीन तनु जानि कै, सुमिरौं पवन-कुमार।","बल बुद्धि बिद्या देहु मोहि, हरहु कलेस बिकार॥"],
 hing:["Buddhiheen tanu jaanike, sumirau Pavan Kumaar","Bal buddhi vidyaa dehu mohi, harahu kalesh vikaar"],
 mt:"Knowing the limits of my understanding, I remember Hanuman, the son of the Wind God. Give me strength, sound judgement, and knowledge, and remove my suffering and harmful tendencies.",
 ex:"The prayer asks for more than physical power. It asks for the courage to act, the wisdom to choose well, and the knowledge to understand. Calling oneself “without wisdom” expresses humility before the divine."};
window.CHALISA_JK = {
 lines:[
  {dev:"सियावर रामचंद्र की जय।",hing:"Siyavar Ramchandra ki jai!",en:"Glory to Shri Rama, the husband of Sita!"},
  {dev:"पवनसुत हनुमान की जय॥",hing:"Pavansut Hanuman ki jai!",en:"Glory to Hanuman, the son of the Wind God!"}],
 rn:{dev:["राम राम जय राजा राम","राम राम जय सीता राम"],hing:["Ram Ram Jai Raja Ram","Ram Ram Jai Sita Ram"],note:"Repeat 11 Times"}};
</script>
<script>(function(){
  var CH=window.CHALISA,JK=window.CHALISA_JK,D=[];
  D.push({t:"sankalp",kl:"Sankalp",img:"sankalp"});
  CH.forEach(function(c,i){c.img=pad(i+1);D.push(c);if(i===0){window.CHALISA_OP2.img="opening2";D.push(window.CHALISA_OP2)}});
  D.push({t:"jaikara",kl:"Jaikara",img:"jaikara"});
  var N=D.length,TRACK_A="3IyAOXe1IP6qbnvSrZqeiE",TRACK_B="6MvqtaK8RDuFlTu9wuH8vy",GOALS=[1,3,7,11];
  var goal=0,round=1;
  try{goal=parseInt(localStorage.getItem("bh_goal")||"0",10)||0;round=parseInt(localStorage.getItem("bh_round")||"1",10)||1}catch(e){}
  function saveRounds(){try{localStorage.setItem("bh_goal",String(goal));localStorage.setItem("bh_round",String(round))}catch(e){}}
  // Folder this page lives in, so images load from /BeHanuman/images/ even when the URL has no trailing slash.
  var BASE=(function(){
    if(location.protocol==="file:")return "";
    var p=location.pathname;
    if(!/\/$/.test(p)&&!/\.[a-z0-9]+$/i.test(p))p+="/";
    return p.replace(/[^\/]*$/,"");
  })();
  function pad(n){return(n<10?"0":"")+n}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  // Test image (the sample Hanuman) shows until a real one exists at images/NN.jpg (.jpeg .png .webp also work)
  function placeholder(){return window.TEST_IMG}
  var EXT=["jpg","jpeg","png","webp"];
  window.__imgFail=function(img){
    var nm=img.dataset.n,k=+img.dataset.k||0;
    if(k<EXT.length-1){img.dataset.k=k+1;img.src=BASE+"images/"+nm+"."+EXT[k+1]}
    else{img.onerror=null;img.src=placeholder()}
  };

  function strip(s){return s.replace(/[।॥\s]+$/,'')}
  function artHTML(c,i){
    return '<div class="art"><img alt="Hanuman, card '+(i+1)+'" data-n="'+c.img+'" data-k="0" src="'+BASE+'images/'+c.img+'.jpg" onerror="__imgFail(this)" draggable="false"></div>';
  }
  function cardHTML(c,i){
    if(c.t==="sankalp"){
      return '<section class="card"><div class="wrap skw">'+artHTML(c,i)+
        '<div class="sk"><h2>Sankalp</h2><p class="mt">How many times will you read the Chalisa today?</p>'+
        '<div class="goals">'+GOALS.map(function(g){return '<button data-g="'+g+'">'+g+'</button>'}).join("")+'</div>'+
        '<div class="mus"><span>Music</span><button data-m="1">On</button><button data-m="0">Off</button></div>'+
        '<p class="ex">Take a breath, pick a number, and read with a steady mind.</p>'+
        '<button id="install" class="lnk" style="display:none">Add to Home Screen</button></div>'+
        '<div class="swipe" aria-hidden="true"><i></i><i></i><span>Swipe up to begin</span></div>'+
        '</div></section>';
    }
    if(c.t==="jaikara"){
      var L=JK.lines.map(function(l){
        return '<div class="jv"><div class="v-hing">'+esc(l.hing)+'</div><div class="v-hi">'+esc(l.dev)+'</div><p class="mt">'+esc(l.en)+'</p></div>';
      }).join("");
      return '<section class="card"><div class="wrap jk">'+artHTML(c,i)+L+
        '<div class="jv rn"><div class="v-hing">'+esc(JK.rn.hing[0])+'<br>'+esc(JK.rn.hing[1])+'</div><div class="v-hi">'+esc(JK.rn.dev[0])+'<br>'+esc(JK.rn.dev[1])+'</div><p class="rep"><i class="bar">||</i> '+esc(JK.rn.note)+' <i class="bar">||</i></p></div>'+
        '<div class="rounds"><p id="rtxt"></p><button id="again"></button></div></div></section>';
    }
    var B='<i class="bar">||</i>';
    var h1=B+' '+esc(c.hing[0]), h2=esc(c.hing[1])+' '+B;
    var d1=B+' '+esc(strip(c.dev[0])), d2=esc(strip(c.dev[1]))+' '+B;
    var lh=Math.max(c.hing[0].length,c.hing[1].length)+3, ld=Math.max(strip(c.dev[0]).length,strip(c.dev[1]).length)+3;
    return '<section class="card'+(c.kl==="Chaupai"?' chp':'')+'" style="--lh:'+lh+';--ld:'+ld+'"><div class="wrap">'+artHTML(c,i)+
      '<div class="verse"><div class="v-hing"><span>'+h1+'</span><span>'+h2+'</span></div>'+
      '<div class="v-hi"><span>'+d1+'</span><span>'+d2+'</span></div></div>'+
      '<div class="mean"><p class="mt">'+esc(c.mt)+'</p></div>'+
      '</div></section>';
  }

  var stage=document.getElementById("stage");
  stage.innerHTML=D.map(cardHTML).join("");
  var cards=[].slice.call(stage.children);
  var cur=0,dy=0,dragging=false,leaving=-1,leaveT=0;
  try{var s=parseInt(localStorage.getItem("bh_card")||"0",10);if(s>=0&&s<N)cur=s}catch(e){}
  var prog=document.getElementById("prog"),hint=document.getElementById("hint"),fl=document.getElementById("flabel"),fc=document.getElementById("fcount");

  function layout(){
    var h=stage.clientHeight||window.innerHeight;
    var p=Math.min(1,Math.abs(dy)/h), up=dy<0?p:0, down=dy>0?p:0;
    cards.forEach(function(el,i){
      var rel=i-cur,y=0,sc=1,z=0,vis=true,rad=0;
      if(rel===0){y=Math.min(dy,0);sc=1-0.06*down;z=20;rad=down*20}
      else if(rel===-1){y=-h+Math.max(dy,0);z=30}
      else if(rel===1){sc=.94+.06*up;y=(1-up)*.03*h;z=10;rad=(1-up)*20}
      else if(i===leaving){
        if(rel<0){y=-h;z=30}else{sc=.94;y=.03*h;z=5;rad=20}
      }else{vis=false;y=rel<0?-h:.03*h;sc=rel<0?1:.94;rad=20}
      el.style.zIndex=z;
      el.style.visibility=vis?"visible":"hidden";
      el.style.borderRadius=rad+"px";
      el.style.transform="translate3d(0,"+y+"px,0) scale("+sc+")";
    });
    prog.style.setProperty("--p",(N>1?cur/(N-1):0));
    var c=D[cur];fl.textContent=c.n?("Chaupai "+c.n):c.kl;
    if(typeof mbtn!=="undefined"&&mbtn)mbtn.style.visibility=(musicOn&&cur>0)?"visible":"hidden";
    fc.firstChild.nodeValue=c.t==="jaikara"?("Round "+Math.min(round,goal||1)+" of "+(goal||1)):c.n?(c.n+" / 40"):((cur+1)+" / "+N);
  }
  function save(){try{localStorage.setItem("bh_card",String(cur))}catch(e){}}
  function goTo(n){
    n=Math.max(0,Math.min(N-1,n));
    if(n!==cur){
      leaving=cur;clearTimeout(leaveT);stage.classList.add("moving");
      leaveT=setTimeout(function(){leaving=-1;stage.classList.remove("moving");layout()},700);
      var was=cur;cur=n;save();hint.classList.add("gone");closeBubble();updateExplain();
      musicSync();
    }
    dy=0;layout();
  }
  function go(d){goTo(cur+d)}

  var sy=0,st=0;
  stage.addEventListener("pointerdown",function(e){
    if(e.target.closest("button,#sheet"))return;
    dragging=true;sy=e.clientY;st=Date.now();dy=0;stage.classList.add("drag","moving");
    try{stage.setPointerCapture(e.pointerId)}catch(x){}
  });
  stage.addEventListener("pointermove",function(e){
    if(!dragging)return;
    dy=e.clientY-sy;
    if((cur===0&&dy>0)||(cur===N-1&&dy<0))dy*=.25;
    layout();
  });
  function end(){
    if(!dragging)return;
    dragging=false;stage.classList.remove("drag");
    var h=stage.clientHeight,v=dy/Math.max(1,Date.now()-st),d=dy;dy=0;
    if(d<-h*.16||(v<-.45&&d<-30))go(1);
    else if(d>h*.16||(v>.45&&d>30))go(-1);
    else{layout();setTimeout(function(){if(leaving<0)stage.classList.remove("moving")},600)}
  }
  stage.addEventListener("pointerup",end);
  stage.addEventListener("pointercancel",end);

  var wheelLock=0;
  window.addEventListener("wheel",function(e){
    if(Math.abs(e.deltaY)<12||Date.now()<wheelLock)return;
    wheelLock=Date.now()+650;go(e.deltaY>0?1:-1);
  },{passive:true});
  document.addEventListener("keydown",function(e){
    if(["ArrowDown","ArrowRight","PageDown"," "].indexOf(e.key)>-1){e.preventDefault();go(1)}
    if(["ArrowUp","ArrowLeft","PageUp"].indexOf(e.key)>-1){e.preventDefault();go(-1)}
  });
  window.addEventListener("resize",layout);

  // Hinglish <-> Hindi toggle (remembered)
  var tgl=document.getElementById("lang"),mode="hing";
  try{if(localStorage.getItem("bh_lang")==="hi")mode="hi"}catch(e){}
  function setMode(m){
    mode=m;document.body.classList.toggle("hi",m==="hi");
    tgl.textContent=m==="hi"?"Hinglish":"हिन्दी";
    try{localStorage.setItem("bh_lang",m)}catch(e){}
  }
  tgl.onclick=function(){setMode(mode==="hi"?"hing":"hi")};
  setMode(mode);

  // Music. Two tracks, chosen by screen: TRACK_A from the Sankalp screen to the Closing Doha, TRACK_B on the Jaikara screen.
  // Browsers only allow sound after a touch, so it starts on the first tap or swipe (picking a number, switching Music On, or swiping on).
  // Spotify's embed has no volume control, so the 50% level cannot be set from here.
  var musicOn=true,muted=false;
  try{if(localStorage.getItem("bh_music")==="0")musicOn=false}catch(e){}
  var sheet=document.getElementById("sheet"),host=document.createElement("div"),ctrl=null,playing=false,wantPlay=false,pendingSync=false,loaded=TRACK_A,lastPos=0,lastDur=0;
  var mbtn=document.getElementById("music");
  sheet.querySelector(".in").appendChild(host);
  function label(){mbtn.textContent=muted?"Unmute":"Mute";mbtn.setAttribute("aria-label",muted?"Unmute music":"Mute music");mbtn.style.visibility=(musicOn&&cur>0)?"visible":"hidden";updateExplain()}
  function updateExplain(){var b=document.getElementById("explain"),c=D[cur];if(!b)return;var ok=c&&!c.t&&c.ex;b.style.visibility=ok?"visible":"hidden";b.dataset.i=cur}
  function plainIframe(){
    if(ctrl||host.querySelector("iframe"))return;
    var f=document.createElement("iframe");
    f.src="https://open.spotify.com/embed/track/"+TRACK_A+"?utm_source=generator&theme=0";
    f.style.cssText="display:block;width:100%;height:80px;border:0;border-radius:12px";
    f.allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
    f.title="Hanuman Chalisa on Spotify";host.appendChild(f);
  }
  function wantTrack(){return cur===N-1?TRACK_B:TRACK_A}
  function musicSync(){
    if(!musicOn||muted)return;
    if(!ctrl){pendingSync=true;return}
    try{
      var t=wantTrack();
      if(loaded!==t){loaded=t;lastPos=0;lastDur=0;ctrl.loadUri("spotify:track:"+t);ctrl.play()}
      else if(!playing)ctrl.play();
      wantPlay=true;
      setTimeout(function(){if(musicOn&&!muted&&!playing){try{ctrl.play()}catch(e){}}},700);
    }catch(e){}
  }
  function backToMain(){}
  window.onSpotifyIframeApiReady=function(API){
    API.createController(host,{uri:"spotify:track:"+TRACK_A,width:"100%",height:80,theme:0},function(c){
      ctrl=c;
      c.addListener("playback_update",function(e){
        if(!e||!e.data)return;var d=e.data;
        playing=d.isPaused===false;if(playing)wantPlay=true;
        // loop: when the track ends (it reports paused near the end), start it again unless muted or switched off
        if(d.isPaused&&wantPlay&&musicOn&&!muted&&lastDur>0&&lastPos>=lastDur-3500&&(d.position||0)<2500){lastPos=0;try{c.seek(0);c.play()}catch(x){}return}
        if(!d.isPaused){lastPos=d.position||0;lastDur=d.duration||lastDur}
      });
      if(pendingSync){pendingSync=false;musicSync()}
    });
  };
  var sc=document.createElement("script");sc.src="https://open.spotify.com/embed/iframe-api/v1";sc.async=true;
  sc.onerror=plainIframe;document.body.appendChild(sc);
  setTimeout(plainIframe,5000);
  // If the browser blocked playback after a screen change, the next touch starts it.
  ["pointerdown","touchend","click"].forEach(function(ev){
    window.addEventListener(ev,function(e){
      if(musicOn&&!muted&&cur>0&&!playing&&ctrl&&!(e.target.closest&&e.target.closest("#music,[data-m]"))){try{ctrl.play()}catch(x){}}
    },{passive:true});
  });
  mbtn.onclick=function(){
    if(!ctrl){plainIframe();sheet.classList.add("open");return}
    if(!muted){muted=true;wantPlay=false;try{ctrl.pause()}catch(e){}}
    else{muted=false;musicSync()}
    label();
  };
  function setMusic(on){
    musicOn=on;try{localStorage.setItem("bh_music",on?"1":"0")}catch(e){}
    if(on){muted=false;musicSync()}else{wantPlay=false;if(ctrl){try{ctrl.pause()}catch(e){}}}
    updateMusicUI();label();
  }
  function updateMusicUI(){[].forEach.call(stage.querySelectorAll("[data-m]"),function(b){b.classList.toggle("on",(b.dataset.m==="1")===musicOn)})}
  document.getElementById("closeSheet").onclick=function(){sheet.classList.remove("open")};

  // Explanation bubble: tap the button under the orange meaning to pop it up; tap anywhere else to close.
  var bub=document.getElementById("bubble"),bubP=bub.querySelector("p"),bubFor=null;
  function closeBubble(){bub.classList.remove("open");bubFor=null}
  function toggleBubble(btn){
    if(bubFor===btn){closeBubble();return}
    bubP.textContent=D[+btn.dataset.i].ex;
    var r=btn.getBoundingClientRect();
    bub.style.bottom=(window.innerHeight-r.top+14)+"px";
    bub.classList.add("open");bubFor=btn;
    var br=bub.getBoundingClientRect();
    bub.style.setProperty("--tx",Math.max(24,Math.min(br.width-24,r.left+r.width/2-br.left))+"px");
  }
  window.addEventListener("pointerdown",function(e){
    if(bubFor&&!e.target.closest("#bubble,#explain"))closeBubble();
  },true);

  // Sankalp and rounds
  function updateRounds(){
    [].forEach.call(stage.querySelectorAll("[data-g]"),function(b){b.classList.toggle("on",+b.dataset.g===goal)});
    var g=goal||1,r=Math.min(round,g),t=document.getElementById("rtxt"),btn=document.getElementById("again");
    if(!t)return;
    // Jaikara picture alternates by round: celebration, Ram Darbar, celebration...
    var jimg=stage.querySelector(".jk .art img"),jn=(r%2===1)?"jaikara":"jaikara2";
    if(jimg&&jimg.dataset.n!==jn){jimg.dataset.n=jn;jimg.dataset.k="0";jimg.onerror=function(){__imgFail(jimg)};jimg.src=BASE+"images/"+jn+".jpg"}
    if(r<g){
      t.innerHTML='<b>Round '+r+' of '+g+' complete</b><span>'+(g-r)+' more to go</span>';
      btn.textContent="Read again: round "+(r+1);btn.dataset.a="again";
    }else{
      t.innerHTML='<b>Sankalp complete</b><span>'+g+(g===1?' reading':' readings')+' done. Jai Hanuman.</span>';
      btn.textContent="Begin a new sankalp";btn.dataset.a="new";
    }
    layout();
  }
  document.getElementById("explain").addEventListener("click",function(){toggleBubble(this)});
  stage.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.m){setMusic(b.dataset.m==="1");return}
    if(b.dataset.g){goal=+b.dataset.g;round=1;saveRounds();updateRounds();musicSync();setTimeout(function(){goTo(1)},180)}
    else if(b.id==="again"){
      if(b.dataset.a==="new"){goal=0;round=1;saveRounds();updateRounds();backToMain();goTo(0)}
      else{round=Math.min(round,goal||1)+1;saveRounds();updateRounds();backToMain();goTo(1)}
    }
    else if(b.id==="install")installApp();
  });

  // Add to Home Screen. Android Chrome can install in one tap; iPhone Safari cannot, so we show the two steps.
  var deferred=null,a2=document.getElementById("a2hs");
  var standalone=window.matchMedia&&matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  function showInstall(){var b=document.getElementById("install");if(b&&!standalone&&(deferred||iOS))b.style.display=""}
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;showInstall()});
  window.addEventListener("appinstalled",function(){standalone=true;var b=document.getElementById("install");if(b)b.style.display="none"});
  function installApp(){
    if(deferred){deferred.prompt();deferred=null;return}
    a2.classList.add("open");
  }
  document.getElementById("a2close").onclick=function(){a2.classList.remove("open")};
  showInstall();
  var mf=document.createElement("link");mf.rel="manifest";mf.href=BASE+"manifest.webmanifest";document.head.appendChild(mf);

  var ai=document.createElement("link");ai.rel="apple-touch-icon";ai.href=BASE+"icon-180.png";document.head.appendChild(ai);
  document.getElementById("reset").onclick=function(){goal=0;round=1;saveRounds();updateRounds();backToMain();goTo(0);hint.classList.remove("gone")};
  if(cur>0)hint.classList.add("gone");
  // Keep the illustration a good size: shrink the meaning text (never the verse) on cards where the text is long.
  function fit(){
    cards.forEach(function(el){
      var m=el.querySelector(".mean"),w=el.querySelector(".wrap");if(!m||!w)return;
      var lim=w.clientHeight-parseFloat(getComputedStyle(w).paddingBottom),k=1;
      m.style.setProperty("--ms",1);
      while(k>.8&&m.offsetTop+m.offsetHeight>lim){k=Math.round((k-.03)*100)/100;m.style.setProperty("--ms",k)}
    });
  }
  window.addEventListener("resize",fit);
  tgl.addEventListener("click",fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  fit();
  updateMusicUI();label();
  updateRounds();
})();
</script>
</body>
</html>
